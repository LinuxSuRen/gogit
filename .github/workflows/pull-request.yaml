name: Pull Request

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_EXECUTOR_NAME: "linuxsuren/workflow-executor-gogit"

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check out code
        uses: actions/checkout@v7
      - name: Build
        run: |
          make build
      - name: Test
        run: |
          make test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: unittests
          name: codecov-umbrella

  build-argo-workflow-executor:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check out code
        uses: actions/checkout@v7
      - name: Test
        run: |
          make build-workflow-executor-gogit test-workflow-executor-gogit

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check out code
        uses: actions/checkout@v7
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: ./...
      - name: Run golangci-lint for the argoworkflow module
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: cmd/argoworkflow
          args: ./...

  goreleaser:
    name: Run GoReleaser
    runs-on: ubuntu-24.04
    if: github.ref != 'refs/heads/master'
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check out code
        uses: actions/checkout@v7
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --snapshot

  build-image:
    name: Build Image
    runs-on: ubuntu-24.04
    if: github.ref != 'refs/heads/master'
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Build Image
        run: |
          make image

  build-image-argo-workflow-executor:
    runs-on: ubuntu-24.04
    if: github.ref != 'refs/heads/master'
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Build Image
        run: |
          make image-workflow-executor-gogit

  image:
    name: Publish Image
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PUBLISH_SECRETS }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image-argo-workflow-executor:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PUBLISH_SECRETS }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_EXECUTOR_NAME }}
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: cmd/argoworkflow
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  UpdateReleaseDraft:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PUBLISH_SECRETS }}
